<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#174f3a">
<title>FruitWise — Fruit Waste Management</title>
<style>
:root{--green:#174f3a;--green2:#28664d;--pale:#edf4e9;--bg:#f4f7f1;--ink:#244a33;--muted:#68756b;--line:#dce5da;--gold:#a9781f;--red:#a85e14}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:10px 13px;background:var(--green);color:white;font-weight:650}button.secondary{background:white;color:var(--green);border:1px solid var(--line)}button.danger{background:#fff1ec;color:#9c422a;border:1px solid #f1d2c7}.app{max-width:760px;margin:auto;min-height:100vh;background:var(--bg)}header{background:var(--green);color:white;padding:22px 18px 20px;border-radius:0 0 24px 24px}.brand{display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:#d9f0d7;color:var(--green);font-size:25px}.brand h1{font-size:24px;margin:0}.brand p{font-size:12px;color:#d4e8d9;margin:3px 0 0}.hello{margin-top:22px;font-size:23px;font-weight:750}.intro{font-size:13px;color:#e0eee4;margin-top:4px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}.stat{background:var(--green2);padding:12px;border-radius:14px;min-width:0}.stat .num{font-size:20px;font-weight:800;margin-top:3px;overflow-wrap:anywhere}.stat .lbl{font-size:11px;color:#e0eee4}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:15px 14px}.nav button{background:#fff;color:var(--ink);border:1px solid var(--line);padding:12px 4px;font-size:12px}.nav button.active{background:#d9ebdd;border-color:#347454;color:#174f3a}.nav .ico{display:block;font-size:21px;margin-bottom:4px}.main{padding:0 14px 28px}.page-title{font-size:22px;margin:7px 0 4px}.sub{color:var(--muted);font-size:13px;margin:0 0 15px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;margin:10px 0}.card h3{font-size:16px;margin:0 0 12px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.small{font-size:12px;color:var(--muted)}.fruit{display:flex;align-items:center;gap:10px}.fruit-icon{width:44px;height:44px;display:grid;place-items:center;border-radius:13px;background:var(--pale);font-size:24px;flex-shrink:0}.fruit-name{font-weight:750}.pill{display:inline-block;font-size:10px;font-weight:750;padding:5px 8px;border-radius:99px;background:#e2f1e3;color:#21653d;white-space:nowrap}.pill.warn{background:#fff0d8;color:#995916}.actions{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}.actions button{flex:1;font-size:12px;padding:9px 8px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px;margin:9px 0}.field label{font-size:12px;font-weight:700;color:#53675b}.field input,.field select{width:100%;padding:11px;border:1px solid #cedbce;border-radius:10px;background:white;color:#243d2d}.full{width:100%;margin-top:8px}.notice{padding:11px 13px;border-radius:12px;background:#e1f2e4;color:#215b3a;font-size:13px;margin:0 14px 4px}.empty{padding:18px;text-align:center;color:var(--muted);font-size:13px}.metric{font-size:25px;font-weight:800;color:var(--green)}.line{border:0;border-top:1px solid #e6ebe3;margin:12px 0}.promo{background:#f4f0e3;border-radius:12px;padding:13px;color:#77571b;margin-top:12px}.footer{text-align:center;color:#738073;font-size:11px;padding:5px 20px 22px} @media(min-width:600px){.nav{grid-template-columns:repeat(6,1fr)}.main{padding:0 22px 30px}header{padding:26px}.stats .num{font-size:24px}}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="brand"><div class="logo">🌱</div><div><h1>FruitWise</h1><p>Fruit Waste Reduction &amp; Management</p></div></div>
 <div class="hello">Good day, Vendor!</div><div class="intro">Manage stocks, track sales, and reduce fruit waste in one place.</div>
 <div class="stats"><div class="stat"><div>📦</div><div class="num" id="stockStat">47</div><div class="lbl">Fruits in stock</div></div><div class="stat"><div>⚠️</div><div class="num" id="urgentStat">2</div><div class="lbl">Urgent stocks</div></div><div class="stat"><div>💰</div><div class="num" id="salesStat">₱0</div><div class="lbl">Recorded sales</div></div></div>
</header>
<nav class="nav" id="nav">
 <button data-page="Home"><span class="ico">🏠</span>Home</button><button data-page="Inventory" class="active"><span class="ico">📦</span>Inventory</button><button data-page="Sales"><span class="ico">📈</span>Sales</button><button data-page="Discounts"><span class="ico">🏷️</span>Discounts</button><button data-page="Processing"><span class="ico">🍹</span>Processing</button><button data-page="Reports"><span class="ico">📋</span>Reports</button>
</nav>
<div id="notice" class="notice" hidden></div>
<main class="main" id="main"></main>
<div class="footer">FruitWise MVP • Demo data is saved in this browser on this device.</div>
</div>
<script>
const starter=[{id:1,name:"Mango",qty:12,days:1},{id:2,name:"Banana",qty:20,days:2},{id:3,name:"Apple",qty:15,days:6}];
let data;
try{data=JSON.parse(localStorage.getItem('fruitwise_data'))||null}catch(e){data=null}
if(!data)data={stocks:starter,sales:[],plans:[]};
let page='Inventory',noticeTimer;
const $=id=>document.getElementById(id);
const money=n=>'₱'+Number(n||0).toLocaleString('en-PH',{maximumFractionDigits:2});
const urgent=()=>data.stocks.filter(f=>f.days<=2);
const totalStock=()=>data.stocks.reduce((s,f)=>s+f.qty,0);
const totalSales=()=>data.sales.reduce((s,f)=>s+f.total,0);
function save(){localStorage.setItem('fruitwise_data',JSON.stringify(data));render()}
function say(msg){$('notice').textContent=msg;$('notice').hidden=false;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('notice').hidden=true,4500)}
function go(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo({top:0,behavior:'smooth'})}
$('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});
function updateStats(){$('stockStat').textContent=totalStock();$('urgentStat').textContent=urgent().length;$('salesStat').textContent=money(totalSales())}
function fruitCard(f){return `<div class="card"><div class="row"><div class="fruit-icon">🍎</div><div class="grow"><div class="fruit-name">${esc(f.name)}</div><div class="small">${f.qty} units in stock</div><div class="small" style="margin-top:4px;color:${f.days<=2?'#a85e14':'#58735d'}">${f.days===0?'Spoilage risk: today':f.days+' day(s) until estimated spoilage'}</div></div><span class="pill ${f.days<=2?'warn':''}">${f.days<=2?'Sell first':'In stock'}</span></div><div class="actions"><button class="secondary" onclick="prepareSale('${escAttr(f.name)}')">Record sale</button><button class="secondary" onclick="prepareDiscount('${escAttr(f.name)}')">Discount</button><button class="danger" onclick="removeFruit(${f.id})">Remove</button></div></div>`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escAttr(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function render(){updateStats();let m=$('main');
if(page==='Home'){m.innerHTML=`<h2 class="page-title">Dashboard</h2><p class="sub">Your fruit business at a glance.</p><div class="card"><h3>Today's priorities</h3>${urgent().length?urgent().map(f=>`<div class="row" style="margin:12px 0"><div class="grow"><b>${esc(f.name)}</b><div class="small">${f.qty} units · ${f.days===0?'Needs attention today':f.days+' day(s) remaining'}</div></div><button onclick="prepareDiscount('${escAttr(f.name)}')">Action</button></div>`).join(''):'<p class="small">No urgent stocks flagged. Keep checking inventory daily.</p>'}</div><button class="full" onclick="go('Inventory')">Manage inventory →</button><button class="full secondary" onclick="go('Sales')">Record a sale</button>`}
if(page==='Inventory'){m.innerHTML=`<div class="row between"><div><h2 class="page-title">Inventory Management</h2><p class="sub">Track quantities and prioritize fruit stocks.</p></div><button onclick="toggleAdd()">＋ Add fruit</button></div><div class="card" id="addBox" hidden><h3>Add new stock</h3><div class="field"><label>Fruit name</label><input id="fruitName" placeholder="Enter fruit name"></div><div class="formgrid"><div class="field"><label>Quantity (units)</label><input id="fruitQty" type="number" min="1" step="1" value="10"></div><div class="field"><label>Days until spoilage</label><input id="fruitDays" type="number" min="0" step="1" value="3"></div></div><button class="full" onclick="addFruit()">Save fruit stock</button></div><p class="small">${data.stocks.length} fruit types · ${totalStock()} total units</p>${data.stocks.length?data.stocks.map(fruitCard).join(''):'<div class="card empty">No stock yet. Tap Add fruit to begin.</div>'}<p class="small">Spoilage estimates are entered manually for this prototype.</p>`}
if(page==='Sales'){m.innerHTML=`<h2 class="page-title">Sales Monitoring</h2><p class="sub">Record transactions and update stock automatically.</p><div class="card"><h3>Record a sale</h3><div class="field"><label>Select fruit</label><select id="saleFruit">${data.stocks.map(f=>`<option>${esc(f.name)}</option>`).join('')}</select></div><div class="formgrid"><div class="field"><label>Quantity sold</label><input id="saleQty" type="number" min="1" step="1" value="2"></div><div class="field"><label>Price per unit (₱)</label><input id="salePrice" type="number" min="0" step=".01" value="50"></div></div><div class="promo"><div class="small">Transaction total</div><div class="metric" id="saleTotal">₱100</div></div><button class="full" onclick="recordSale()">Save sale</button></div><div class="card"><h3>Sales history</h3><div class="row between"><span class="small">${data.sales.length} transaction(s)</span><b>${money(totalSales())}</b></div><hr class="line">${data.sales.length?data.sales.map(s=>`<div class="row between" style="margin:10px 0"><div><b>${esc(s.name)}</b><div class="small">${s.qty} × ${money(s.price)}</div></div><b>${money(s.total)}</b></div>`).join(''):'<div class="empty">No sales recorded yet.</div>'}</div>`;let q=$('saleQty'),p=$('salePrice');const upd=()=>{if($('saleTotal'))$('saleTotal').textContent=money(Math.max(0,+q.value||0)*Math.max(0,+p.value||0))};if(q&&p){q.addEventListener('input',upd);p.addEventListener('input',upd)}}
if(page==='Discounts'){m.innerHTML=`<h2 class="page-title">Discounts &amp; Promotions</h2><p class="sub">Create offers to help sell ripe fruit before it spoils.</p><div class="card"><h3>Quick discount calculator</h3><div class="field"><label>Fruit to promote</label><select id="discountFruit">${data.stocks.map(f=>`<option>${esc(f.name)}</option>`).join('')}</select></div><div class="field"><label>Discount percentage</label><select id="discountPercent"><option value="10">10% off — small promotion</option><option value="20" selected>20% off — recommended offer</option><option value="30">30% off — stronger promotion</option></select></div><div class="promo"><div id="promoLabel">Suggested offer</div><h2 id="promoValue">20% OFF</h2><div class="small">Example: a ₱100 item becomes <b id="promoPrice">₱80</b>.</div></div><button class="full" onclick="savePromo()">Prepare promotion</button></div><div class="card"><h3>Bundle deal idea</h3><p class="small">Combine suitable ripe fruits into an affordable mixed-fruit package. Set a bundle price that covers your costs and appeals to customers.</p></div>`;let d=$('discountFruit'),p=$('discountPercent');const upd=()=>{let n=+p.value;let f=data.stocks.find(x=>x.name===d.value);$('promoLabel').textContent=`Suggested offer for ${f?f.name:'fruit'} · ${f?f.qty:0} units remaining`;$('promoValue').textContent=n+'% OFF';$('promoPrice').textContent=money(100*(1-n/100))};d.addEventListener('change',upd);p.addEventListener('change',upd);upd()}
if(page==='Processing'){let u=urgent();m.innerHTML=`<h2 class="page-title">Fruit Processing</h2><p class="sub">Plan safe ways to use suitable ripe fruit instead of wasting it.</p>${u.length?u.map(f=>`<div class="card"><div class="row"><div class="fruit-icon">🍌</div><div class="grow"><b>${esc(f.name)}</b><div class="small">${f.qty} units · ${f.days===0?'Spoilage risk today':f.days+' day(s) estimated'}</div></div></div><p class="small">Check quality first. If sound and suitable, consider juice, smoothies, or fruit salad.</p><button class="full secondary" onclick="addPlan(${f.id})">＋ Add processing plan</button></div>`).join(''):'<div class="card empty">No urgent fruits identified. Check inventory regularly.</div>'}<div class="card"><h3>Processing plans</h3>${data.plans.length?data.plans.map(p=>`<div class="row between" style="margin:10px 0"><div><b>${esc(p.name)}</b><div class="small">${p.qty} units considered</div></div><span class="pill">Planned</span></div>`).join(''):'<div class="empty">No processing plans yet.</div>'}<p class="small">Only process fruit that is safe and suitable. Discard spoiled or contaminated fruit. Plans do not deduct stock.</p></div>`}
if(page==='Reports'){m.innerHTML=`<h2 class="page-title">Reports &amp; Summary</h2><p class="sub">Review the current prototype data.</p><div class="card"><h3>Inventory report</h3><div class="row between" style="margin:12px 0"><span class="small">Fruit types</span><b>${data.stocks.length}</b></div><div class="row between" style="margin:12px 0"><span class="small">Total units remaining</span><b>${totalStock()}</b></div><div class="row between" style="margin:12px 0"><span class="small">Stocks needing attention</span><b style="color:#a85e14">${urgent().length}</b></div><hr class="line"><h3>Sales report</h3><div class="row between" style="margin:12px 0"><span class="small">Transactions</span><b>${data.sales.length}</b></div><div class="row between" style="margin:12px 0"><span class="small">Total recorded sales</span><b>${money(totalSales())}</b></div><hr class="line"><h3>Stock details</h3>${data.stocks.map(f=>`<div class="row between" style="margin:10px 0"><span>${esc(f.name)}</span><b>${f.qty} units</b></div>`).join('')||'<p class="small">No inventory data.</p>'}<button class="full secondary" onclick="exportCSV()">Download sales CSV</button><button class="full secondary" onclick="resetDemo()">Reset demo data</button></div>`}
}
function toggleAdd(){let b=$('addBox');b.hidden=!b.hidden;document.querySelector('button[onclick="toggleAdd()"]').textContent=b.hidden?'＋ Add fruit':'Cancel'}
function addFruit(){let name=$('fruitName').value.trim(),qty=+$('fruitQty').value,days=+$('fruitDays').value;if(!name||!Number.isInteger(qty)||qty<=0||$('fruitDays').value===''||!Number.isInteger(days)||days<0){say('Enter a fruit name, a positive whole quantity, and 0 or more days.');return}data.stocks.push({id:Date.now(),name,qty,days});save();say(name+' added to inventory.')}
function removeFruit(id){let f=data.stocks.find(x=>x.id===id);if(confirm('Remove '+f.name+' from inventory?')){data.stocks=data.stocks.filter(x=>x.id!==id);save();say(f.name+' removed from inventory.')}}
function prepareSale(name){go('Sales');setTimeout(()=>{if($('saleFruit'))$('saleFruit').value=name},0)}
function prepareDiscount(name){go('Discounts');setTimeout(()=>{if($('discountFruit')){$('discountFruit').value=name;$('discountFruit').dispatchEvent(new Event('change'))}},0)}
function recordSale(){let name=$('saleFruit').value,q=+$('saleQty').value,p=+$('salePrice').value,f=data.stocks.find(x=>x.name===name);if(!f||!Number.isInteger(q)||q<=0||$('salePrice').value===''||!Number.isFinite(p)||p<0){say('Select a fruit and enter a valid quantity and price.');return}if(q>f.qty){say(`Not enough ${name} in stock. Available: ${f.qty}.`);return}f.qty-=q;data.sales.unshift({id:Date.now(),name,qty:q,price:p,total:q*p,date:new Date().toISOString()});save();say(`Sale saved. ${q} ${name} unit(s) deducted from stock.`)}
function savePromo(){let name=$('discountFruit').value,p=$('discountPercent').value; if(!name){say('Add fruit to inventory before preparing a promotion.');return}say(`Promotion prepared: ${p}% off ${name}. Apply it at your stall and monitor sales.`)}
function addPlan(id){let f=data.stocks.find(x=>x.id===id);data.plans.unshift({id:Date.now(),name:f.name,qty:f.qty});save();say('Processing plan saved for '+f.name+'. No stock was deducted.')}
function exportCSV(){let rows=[['Fruit','Quantity','Unit price','Total','Date'],...data.sales.map(s=>[s.name,s.qty,s.price,s.total,s.date||''])];let csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='fruitwise-sales-report.csv';a.click();URL.revokeObjectURL(a.href)}
function resetDemo(){if(confirm('Reset all demo stock, sales, and processing plans?')){data={stocks:starter.map(x=>({...x})),sales:[],plans:[]};save();say('Demo data restored.')}}
render();
</script>
</body>
</html>
